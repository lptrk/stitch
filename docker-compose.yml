version: "3.9"

services:
  app:
    build: .
    container_name: stitch
    ports:
      - "3000:3000"
    volumes:
      - ./workflows:/app/workflows:ro
      - stitch-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${STITCH_API_KEY}

volumes:
  stitch-data:
